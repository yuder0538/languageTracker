<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>複習 — 變體 B：上下展開式</title>
<style>
  :root {
    --grey-100:#ededed; --grey-500:#6e6e72; --grey-800:#26262a; --grey-900:#1b1b1e; --grey-950:#121214;
    --brand-500:#e8b944; --info-500:#4fa3c7; --danger:#e5484d; --success:#3ea574; --warning:#d97b29;
    --border:#2b2b2e; --fg:#ededed; --fg-muted:#9a9a9a;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
    --font-mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--grey-950); color:var(--fg); font-family:var(--font-sans); font-size:14px; line-height:1.6; min-height:100vh; display:flex; flex-direction:column; }
  .variant-banner { background:var(--info-500); color:var(--grey-950); font-size:12px; padding:8px 16px; text-align:center; font-weight:500; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
  .exit-btn { width:32px; height:32px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--fg-muted); cursor:pointer; }
  .progress-wrap { flex:1; margin:0 24px; }
  .progress-track { height:6px; border-radius:999px; background:var(--grey-800); overflow:hidden; }
  .progress-fill { height:100%; width:16%; background:var(--brand-500); border-radius:999px; }
  .progress-label { font-size:12px; color:var(--fg-muted); margin-top:6px; text-align:center; }
  .streak { font-size:12px; color:var(--brand-500); font-weight:500; white-space:nowrap; }

  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:16px; }
  .card {
    width:100%; max-width:480px; border-radius:8px; background:var(--grey-900); padding:32px;
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
  }
  .question-block { padding-bottom:20px; }
  .card-word { font-size:36px; font-weight:600; }
  .card-pos { font-size:13px; color:var(--fg-muted); }

  .answer-block { width:100%; padding-top:20px; border-top:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .card-answer { font-size:24px; font-weight:500; color:var(--brand-500); }
  .card-hint { font-size:12px; color:var(--fg-muted); }

  .reveal-btn { height:44px; width:100%; max-width:480px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--fg-muted); font-family:inherit; font-size:13px; cursor:pointer; }

  .grade-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:100%; max-width:480px; }
  .grade-btn { height:56px; border-radius:8px; border:1px solid var(--border); background:var(--grey-900); color:var(--fg); cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .grade-btn .key { font-size:11px; font-weight:400; color:var(--fg-muted); }
  .grade-again { color:var(--danger); }
  .grade-hard { color:var(--warning); }
  .grade-good { color:var(--info-500); }
  .grade-easy { color:var(--success); }
</style>
</head>
<body>
<div class="variant-banner">Mockup 變體 B — 上下展開式（已顯示答案後的狀態；僅供版型比較，非最終實作）</div>
<div class="topbar">
  <button class="exit-btn">✕</button>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="progress-label">3 / 18</div>
  </div>
  <span class="streak">🔥 12</span>
</div>

<div class="stage">
  <div class="card">
    <div class="question-block">
      <div class="card-word">die Freiheit</div>
      <div class="card-pos">名詞 · die</div>
    </div>
    <div class="answer-block">
      <div class="card-answer">自由</div>
      <div class="card-hint">單字仍留在畫面上方，不會被蓋掉</div>
    </div>
  </div>

  <div class="grade-row">
    <button class="grade-btn grade-again">忘記<span class="key">1</span></button>
    <button class="grade-btn grade-hard">困難<span class="key">2</span></button>
    <button class="grade-btn grade-good">一般<span class="key">3</span></button>
    <button class="grade-btn grade-easy">容易<span class="key">4</span></button>
  </div>
</div>
</body>
</html>
